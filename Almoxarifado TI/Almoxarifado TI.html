/* ---------- busca global ---------- */
function globalResults(q) {
  const nq = norm(q), groups = [];
  if (!nq) return groups;
  const pats = db.pats.filter(p => hit(norm([p.num, p.locadora, p.cat, p.marca, p.modelo, p.un, p.setor].join(' ')), nq))
    .sort((a, b) => (b.num === q.trim()) - (a.num === q.trim()) || (a.status === 'ativo' ? -1 : 1)).slice(0, 8);
  if (pats.length) groups.push(['Patrimônios', pats.map(p => ({ act: 'pat-open', id: p.id, html: `${patIdentHtml(p)} ${esc(patDesc(p))}`, sub: (p.status === 'descartado' ? 'Descartado · ' : '') + esc(loc(p.un, p.setor)) }))]);
  const prods = db.produtos.filter(p => hit(norm(prodLabel(p) + ' ' + p.tipo), nq)).slice(0, 6);
  if (prods.length) groups.push(['Itens e toners', prods.map(p => ({ act: 'prod-open', id: p.id, html: esc(prodLabel(p)), sub: `Estoque ${p.qtd}` }))]);
  const units = db.unidades.filter(u => hit(norm(u.nome), nq) || u.setores.some(s => hit(norm(s), nq))).slice(0, 5);
  if (units.length) groups.push(['Unidades', units.map(u => ({ href: `#/patrimonios?un=${encodeURIComponent(u.nome)}`, html: esc(u.nome), sub: plural(db.pats.filter(p => p.un === u.nome && p.status === 'ativo').length, 'patrimônio') }))]);
  const protos = db.protocolos.filter(pr => String(pr.num) === q.trim() || hit(norm(pr.pessoa), nq)).slice(0, 5);
  if (protos.length) groups.push(['Protocolos', protos.map(pr => ({ href: `#/movimentacoes?p=${pr.num}`, html: `Nº ${pr.num} · ${esc(TIPOS[pr.tipo].label)}`, sub: `${fmtD(pr.data)} · ${esc(protoDest(pr))}` }))]);
  return groups;
}
function showGlobal() {
  const q = $('#gq').value, box = $('#gresults');
  const groups = globalResults(q);
  if (!q.trim()) { box.hidden = true; return; }
  box.hidden = false;
  if (!groups.length) { box.innerHTML = `<div class="empty" style="padding:16px">Nada encontrado para "${esc(q)}".</div>`; return; }
  let i = 0;
  box.innerHTML = groups.map(([g, items]) => `<h6>${g}</h6>` + items.map(it => `<button class="${i++ === 0 ? 'sel' : ''}" ${it.act ? `data-act="${it.act}" data-id="${it.id}"` : `data-act="go" data-href="${it.href}"`}><span>${it.html}</span><span class="sub">${it.sub}</span></button>`).join('')).join('');
}

document.addEventListener('paste', e => { marcaSujo(e); const t = e.target.closest('[data-paste]'); if (t) INPUTS[t.dataset.paste](t, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.lightbox')) { ACTIONS['foto-fechar'](); return; }
  if (e.key === 'Escape' && $('#layer').innerHTML) { layerFora(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.dataset && e.target.dataset.ctrlEnter) { e.preventDefault(); ACTIONS[e.target.dataset.ctrlEnter](e.target); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACTIONS[e.target.dataset.enter](e.target); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); $('#gq').focus(); $('#gq').select(); }
});
$('#gq').addEventListener('input', showGlobal);
$('#gq').addEventListener('focus', showGlobal);
$('#gq').addEventListener('keydown', e => {
  const btns = $$('#gresults button'); if (!btns.length) return;
  let i = btns.findIndex(b => b.classList.contains('sel'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, j) => b.classList.toggle('sel', j === i)); btns[i].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); btns[Math.max(0, i)].click(); }
  else if (e.key === 'Escape') { $('#gresults').hidden = true; }
});
window.addEventListener('hashchange', route);
document.addEventListener('click', hideCandsOutside);

/* ---------- início ---------- */
(async function init() {
  try { if (localStorage.getItem('almox-lanc-modo') === 'texto') ui.lancModo = 'texto'; } catch {}
  if (matchMedia('(max-width: 520px)').matches) $('#gq').placeholder = 'Buscar em tudo';
  $('.menu-btn').innerHTML = icon('menu');
  $$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon); });
  $('.gsearch').insertAdjacentHTML('afterbegin', icon('search'));
  db = await loadDb();
  if (!db) { db = buildInitialDb(); await persist(); }
  fotosGc();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  route();
})();
</script>
