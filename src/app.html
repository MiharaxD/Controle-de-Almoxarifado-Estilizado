    radial-gradient(ellipse 70% 45% at 78% -8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 72%),
    radial-gradient(ellipse 55% 40% at 0% 105%, color-mix(in srgb, var(--warn) 7%, transparent), transparent 70%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(var(--dot) 1px, transparent 1.5px) 0 0 / 6px 6px; -webkit-mask-image: radial-gradient(ellipse 110% 90% at 85% 0%, #000 10%, rgba(0, 0, 0, .35) 70%, rgba(0, 0, 0, .2)); mask-image: radial-gradient(ellipse 110% 90% at 85% 0%, #000 10%, rgba(0, 0, 0, .35) 70%, rgba(0, 0, 0, .2)); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--grain) 0 0 / 220px 220px; opacity: .05; }
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.num, td.n, .kpi b, .toner .qty b { font-variant-numeric: lining-nums tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: rotate .25s var(--out), translate .2s var(--out); }
.cap { font-family: var(--cond); font-stretch: condensed; text-transform: uppercase; letter-spacing: .1em; }

/* layout */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: linear-gradient(180deg, var(--bg-2), var(--bg) 70%); border-right: 1px solid var(--border); box-shadow: inset -1px 0 0 var(--rule); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 18px 18px; margin: 0 12px; border-bottom: 3px double var(--border-strong); }
.brand-mark { width: 42px; height: 42px; flex: none; color: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }
.brand-mark svg { width: 100%; height: 100%; display: block; transition: rotate .35s var(--out); }
.brand:hover .brand-mark svg { rotate: 45deg; }
.brand b { display: block; font: 600 17px/1 var(--display); text-transform: uppercase; letter-spacing: 0; }
:where(.brand b, .page-head h1, .empty b, .drawer > header h2, .modal > header h2) { font-variant-numeric: lining-nums; }
.brand small { display: block; margin-top: 4px; color: var(--sage); font: 600 11px/1 var(--cond); font-stretch: condensed; letter-spacing: .24em; text-transform: uppercase; }
.nav { padding: 6px 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.nav h6 { display: flex; align-items: center; gap: 10px; margin: 16px 8px 6px; font: 600 11px/1 var(--cond); font-stretch: condensed; letter-spacing: .22em; text-transform: uppercase; color: var(--sage); }
.nav h6::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }
.nav a { position: relative; display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; font: 500 15px/1 var(--cond); font-stretch: condensed; letter-spacing: .05em; text-transform: uppercase; background: linear-gradient(90deg, var(--accent-soft), transparent) no-repeat 0 0 / 0 100%; transition: background-size .28s var(--out), color .15s, box-shadow .2s, rotate .25s var(--out); }
.nav a:hover { background-size: 100% 100%; color: var(--text); }
.nav a:hover svg.i { translate: 2px 0; }
.nav a::before { content: ""; position: absolute; left: -9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; background: var(--accent); rotate: 45deg; scale: 0; box-shadow: 0 0 10px var(--accent); transition: scale .25s var(--out); }
.nav a[aria-current="page"] { color: var(--accent); background-image: linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent) 3%, transparent)); background-size: 100% 100%; box-shadow: inset 0 0 0 1px var(--accent-line), 0 6px 16px -10px var(--accent-glow); rotate: -1deg; }
.nav a[aria-current="page"]::before { scale: 1; }
.nav a .count { margin-left: auto; font-size: 13px; letter-spacing: .04em; color: var(--text-3); font-variant-numeric: tabular-nums; text-transform: none; }
.nav a[aria-current="page"] .count { color: var(--accent); }
.side-foot { position: relative; margin-top: auto; padding: 72px 18px 18px; font-size: 12px; color: var(--text-3); }
.side-foot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 70px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, var(--surface-3)), var(--surface-2)); -webkit-mask: var(--skyline) center bottom / cover no-repeat; mask: var(--skyline) center bottom / cover no-repeat; opacity: .55; pointer-events: none; }
.side-foot::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 70px; background: radial-gradient(ellipse 60% 70% at 50% 100%, var(--accent-glow), transparent 70%); opacity: .35; pointer-events: none; z-index: -1; }

.main { min-width: 0; display: flex; flex-direction: column; overflow-x: clip; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 var(--rule); }
.topbar .menu-btn { display: none; }
.gsearch { position: relative; flex: 1; max-width: 560px; }
.gsearch input { width: 100%; height: 40px; padding: 0 64px 0 40px; }
.gsearch > .i { position: absolute; left: 13px; top: 11px; color: var(--sage); pointer-events: none; z-index: 1; }
.gsearch kbd { position: absolute; right: 10px; top: 9px; }
kbd { font: 600 12px/1.5 var(--cond); font-stretch: condensed; letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 2px; color: var(--text-2); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--border); }
.gresults { position: absolute; top: 48px; left: 0; right: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-2); max-height: 70vh; overflow-y: auto; padding: 6px; transform-origin: top center; }
.gresults:not([hidden]) { animation: unfold .2s var(--out); }
.gresults h6 { margin: 10px 8px 4px; font: 600 11px/1 var(--cond); font-stretch: condensed; text-transform: uppercase; letter-spacing: .2em; color: var(--sage); }
.gresults button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; padding: 8px; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; transition: background-color .12s, padding .2s var(--out); }
.gresults button:hover, .gresults button.sel { background: var(--accent-soft); padding-left: 12px; }
.gresults .sub { color: var(--text-3); font-size: 13px; margin-left: auto; text-align: right; }
.top-actions { margin-left: auto; display: flex; gap: 10px; padding-right: 6px; }

.view { padding: 28px; max-width: 1440px; width: 100%; }
.view:focus { outline: none; }
.page-head { position: relative; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-strong); }
.page-head::before { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px; background: linear-gradient(90deg, var(--border), transparent 80%); }
.page-head::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 7px; height: 7px; background: var(--bg); border: 1px solid var(--accent); rotate: 45deg; }
.page-head h1 { margin: 0; font: 600 clamp(28px, 3.6vw, 46px)/1 var(--display); text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; text-shadow: 2px 2px 0 color-mix(in srgb, var(--danger-ink) 80%, transparent), 0 0 34px color-mix(in srgb, var(--accent) 18%, transparent); }
.page-head p { margin: 8px 0 0; color: var(--sage); font: 600 13px/1.3 var(--cond); font-stretch: condensed; letter-spacing: .16em; text-transform: uppercase; }
.page-head .actions { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }

/* controls */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 15px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: linear-gradient(180deg, var(--surface-3), var(--surface-2)); color: var(--text); font: 600 14px/1 var(--cond); font-stretch: condensed; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: inset 0 1px 0 var(--rule); transition: background-color .15s, border-color .15s, color .15s, box-shadow .2s, transform .12s var(--out); }
.btn:hover { border-color: var(--accent-line); color: var(--accent); box-shadow: inset 0 1px 0 var(--rule), 0 6px 18px -8px var(--accent-glow); }
.btn:active { transform: translateY(1px) scale(.98); transition-duration: .05s; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); border-color: var(--accent); color: var(--accent-fg); box-shadow: 0 0 22px -8px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn.primary:hover { color: var(--accent-fg); filter: brightness(1.06); box-shadow: 0 0 28px -4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn.primary:not(.sm)::before, .btn.primary:not(.sm)::after { content: ""; position: absolute; top: -5px; bottom: -5px; width: 7px; border: 1.5px solid var(--accent); pointer-events: none; opacity: .75; transition: translate .25s var(--out), opacity .2s; }
.btn.primary:not(.sm)::before { left: -6px; border-right: 0; }
.btn.primary:not(.sm)::after { right: -6px; border-left: 0; }
.btn.primary:hover::before { translate: -3px 0; opacity: 1; }
.btn.primary:hover::after { translate: 3px 0; opacity: 1; }
.btn.danger { color: var(--danger); border-color: var(--danger-line); background: linear-gradient(180deg, color-mix(in srgb, var(--danger) 9%, var(--surface-2)), var(--surface-2)); }
.btn.danger:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); border-color: transparent; box-shadow: none; }
.btn[data-act="close-layer"]:hover svg.i, .btn[data-act="foto-fechar"]:hover svg.i { rotate: 90deg; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn.icon { padding: 0; width: 38px; }
.btn.icon.sm { width: 32px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.6); transform: none; }
label.f { display: flex; flex-direction: column; gap: 5px; font: 600 12px/1.2 var(--cond); font-stretch: condensed; letter-spacing: .12em; text-transform: uppercase; color: var(--sage); }
label.f .hint { font: 400 12px/1.35 var(--font); letter-spacing: 0; text-transform: none; color: var(--text-3); }
.input, select.input, textarea.input { height: 38px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--well); color: var(--text); font: 400 14px var(--font); letter-spacing: 0; text-transform: none; min-width: 0; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .35); transition: border-color .15s, box-shadow .2s; }
.input::placeholder { color: var(--text-3); }
select.input { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--sage) 50%), linear-gradient(135deg, var(--sage) 50%, transparent 50%); background-position: right 15px top 50%, right 10px top 50%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
select.input:focus { background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%); }
select.input option { background: var(--surface); color: var(--text); }
.input::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; transition: opacity .15s; }
.input::-webkit-calendar-picker-indicator:hover { opacity: 1; }
textarea.input { height: auto; min-height: 64px; padding: 8px 11px; resize: vertical; }
.input:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--border-strong)); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .35), 0 0 0 3px var(--accent-soft), 0 0 18px -6px var(--accent-glow); }
.input:disabled { opacity: .5; }
.input.err { border-color: var(--danger); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .35), 0 0 0 3px var(--danger-soft); animation: shake .3s var(--out); }
.err-msg { color: var(--danger); font-size: 12px; font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; min-height: 32px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.seg { display: inline-flex; padding: 4px; gap: 4px; background: var(--well); border: 1px solid var(--border); border-radius: var(--radius); flex-wrap: wrap; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .35); }
.seg button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--radius-sm); background: none; font: 600 14px/1 var(--cond); font-stretch: condensed; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); cursor: pointer; transition: background-color .2s, color .15s, border-color .2s, box-shadow .25s var(--out); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, var(--surface-3), var(--surface-2)); border-color: var(--border-strong); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .4), inset 0 -2px 0 var(--ink, var(--accent)); }
.seg.lg button { min-height: 46px; padding: 0 20px; font-size: 16px; }
.seg.lg button[aria-pressed="true"] { color: var(--ink); box-shadow: 0 2px 10px rgba(0, 0, 0, .45), inset 0 -2px 0 var(--ink); }
.t-in { --ink: var(--accent); }
.t-out { --ink: var(--info); }
.t-tr { --ink: var(--violet); }
.t-dc { --ink: var(--danger); }

/* surfaces */
.card { position: relative; background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.card::before, .modal::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--frame); border-radius: 1px; pointer-events: none; }
.card::after, .modal::after { content: ""; position: absolute; inset: -1px; pointer-events: none; z-index: 1; background: linear-gradient(var(--corner), var(--corner)) 0 0 / 12px 1px, linear-gradient(var(--corner), var(--corner)) 0 0 / 1px 12px, linear-gradient(var(--corner), var(--corner)) 100% 0 / 12px 1px, linear-gradient(var(--corner), var(--corner)) 100% 0 / 1px 12px, linear-gradient(var(--corner), var(--corner)) 0 100% / 12px 1px, linear-gradient(var(--corner), var(--corner)) 0 100% / 1px 12px, linear-gradient(var(--corner), var(--corner)) 100% 100% / 12px 1px, linear-gradient(var(--corner), var(--corner)) 100% 100% / 1px 12px; background-repeat: no-repeat; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 3px double var(--border-strong); background: radial-gradient(var(--dot) 1px, transparent 1.5px) 0 0 / 5px 5px, linear-gradient(180deg, var(--surface-2), transparent); }
.card > header h2 { display: flex; align-items: center; gap: 10px; margin: 0; font: 600 15px/1.2 var(--cond); font-stretch: condensed; letter-spacing: .14em; text-transform: uppercase; }
.card > header h2:first-child::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--accent); rotate: 45deg; }
.card > header .more { margin-left: auto; font: 600 12px/1 var(--cond); font-stretch: condensed; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.card > header .more::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 1.5px 1.5px 0 0; rotate: 45deg; transition: translate .2s var(--out); }
.card > header .more:hover::after { translate: 3px 0; }
.card .body { padding: 16px; }
.grid { display: grid; gap: 18px; }
.g-kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.g-2 > .grid { grid-template-columns: minmax(0, 1fr); }
.g-half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: border-color .2s, box-shadow .3s var(--out), translate .3s var(--out), rotate .3s var(--out); }
a.kpi:hover { border-color: var(--accent-line); translate: 0 -2px; rotate: 0deg; box-shadow: var(--shadow-2), 0 10px 26px -12px var(--accent-glow); }
.kpi span { color: var(--sage); font: 600 12px/1.2 var(--cond); font-stretch: condensed; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.kpi b { font: 600 46px/1 var(--cond); font-stretch: condensed; letter-spacing: .01em; color: var(--text); }
.kpi small { color: var(--text-3); font-size: 12px; }
.kpi.warn b { color: var(--warn); text-shadow: 0 0 22px color-mix(in srgb, var(--warn) 45%, transparent); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.quick a { --tilt: -.8deg; position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 70px; border-radius: var(--radius); border: 1px solid var(--border); background: radial-gradient(var(--dot) 1px, transparent 1.5px) 0 0 / 5px 5px, linear-gradient(160deg, var(--surface-3), var(--surface) 65%); color: var(--text); text-decoration: none; font: 600 17px/1.1 var(--cond); font-stretch: condensed; letter-spacing: .08em; text-transform: uppercase; box-shadow: var(--shadow-1); transform: rotate(var(--tilt)); transition: transform .3s var(--out), border-color .2s, box-shadow .3s var(--out); }
.quick a:nth-child(even) { --tilt: .9deg; }
.quick a:nth-child(3) { --tilt: -.4deg; }
.quick a:hover { transform: rotate(0deg) translateY(-4px); border-color: color-mix(in srgb, var(--ink) 55%, transparent); box-shadow: var(--shadow-2), 0 10px 28px -12px var(--ink); }
.quick a:active { transform: rotate(0deg) translateY(-1px) scale(.99); }
.quick a .ico { width: 40px; height: 40px; }
.quick a small { display: block; margin-top: 4px; font: 400 12px/1.3 var(--font); letter-spacing: 0; text-transform: none; color: var(--text-2); }
.ico { position: relative; flex: none; display: grid; place-items: center; color: var(--ink, var(--text-2)); }
.ico::before { content: ""; position: absolute; inset: 15%; rotate: 45deg; border: 1px solid color-mix(in srgb, var(--ink, var(--text-3)) 55%, transparent); background: color-mix(in srgb, var(--ink, var(--text-3)) 13%, transparent); border-radius: 2px; transition: rotate .4s var(--out), background-color .2s; }
.ico > svg { position: relative; }
.ico.i32 { width: 32px; height: 32px; }
a:hover > .ico::before, .row:hover .ico::before { rotate: 135deg; background: color-mix(in srgb, var(--ink, var(--text-3)) 22%, transparent); }

.banner { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--warn-line); background: radial-gradient(color-mix(in srgb, var(--warn) 12%, transparent) 1px, transparent 1.5px) 0 0 / 5px 5px, var(--warn-soft); color: var(--text); margin-bottom: 16px; }
.banner .i { color: var(--warn); margin-top: 2px; }
.banner.info { border-color: var(--info-line); background: radial-gradient(color-mix(in srgb, var(--info) 12%, transparent) 1px, transparent 1.5px) 0 0 / 5px 5px, var(--info-soft); }
.banner.info .i { color: var(--info); }
.banner .actions { margin-left: auto; display: flex; gap: 8px; }

/* badges: carimbos */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 2px; font: 700 12px/1 var(--cond); font-stretch: condensed; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; border: 1.5px solid currentColor; background: color-mix(in srgb, currentColor 9%, transparent); rotate: -2deg; -webkit-mask: var(--ink-mask) 0 0 / 90px 30px; mask: var(--ink-mask) 0 0 / 90px 30px; }
.badge svg.i { width: 13px; height: 13px; }
tr:nth-child(even) .badge, li:nth-child(even) .badge { rotate: 1.5deg; }
.b-ok, .b-in { color: var(--accent); }
.b-low, .b-warn { color: var(--warn); }
.b-zero, .b-dc { color: var(--danger); }
.b-out { color: var(--info); }
.b-tr { color: var(--violet); }
.b-neutral { color: var(--text-2); rotate: 0deg; -webkit-mask: none; mask: none; border-width: 1px; border-color: var(--border-strong); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1px solid color-mix(in srgb, var(--text) 40%, transparent); }

/* tables */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.toolbar .search { position: relative; flex: 1 1 240px; max-width: 360px; }
.toolbar .search .i { position: absolute; left: 10px; top: 10px; color: var(--sage); pointer-events: none; z-index: 1; }
.toolbar .search input { width: 100%; padding-left: 34px; }
.toolbar .count { margin-left: auto; color: var(--text-3); font: 600 12px var(--cond); font-stretch: condensed; letter-spacing: .12em; text-transform: uppercase; }
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font: 600 12px/1.2 var(--cond); font-stretch: condensed; color: var(--sage); text-transform: uppercase; letter-spacing: .14em; padding: 11px 12px 9px; border-bottom: 3px double var(--border-strong); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
table.t thead tr { box-shadow: inset 0 1px 0 var(--accent-line); }
table.t thead th:first-child::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 9px 2px 0; background: var(--accent); rotate: 45deg; vertical-align: middle; }

.selbox { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--well); color: var(--accent-fg); cursor: pointer; transition: background-color .15s, border-color .15s; }

.btn .n-sel { min-width: 20px; padding: 3px 6px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-size: 12px; line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.btn.primary .n-sel { background: var(--accent-fg); color: var(--accent); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
.list li:last-child { border-bottom: 0; }

.list a.row:hover { translate: 3px 0; }
table.t.eq td.n { font-variant-numeric: tabular-nums; }

table.t.eq tfoot td { padding: 10px 12px; border-top: 3px double var(--border-strong); font: 700 13px var(--cond); font-stretch: condensed; letter-spacing: .1em; text-transform: uppercase; }

/* toners */
.toner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.toner { padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, translate .3s var(--out), box-shadow .3s var(--out), rotate .3s var(--out); }

:where(.toner:nth-child(even), a.kpi:nth-child(even)) { rotate: .45deg; }
.toner .top { display: flex; align-items: center; gap: 8px; }
.toner .top b { font: 600 15px/1.25 var(--cond); font-stretch: condensed; letter-spacing: .05em; text-transform: uppercase; }
.toner .qty { display: flex; align-items: baseline; gap: 6px; }
.toner .qty b { font: 600 36px/1 var(--cond); font-stretch: condensed; }

.meter i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transform-origin: left; }
.meter.low i { background: var(--warn); box-shadow: 0 0 10px var(--warn-line); }
.meter.zero i { background: var(--danger); }
.toner .acts { display: flex; gap: 6px; }

/* lançamento */
.lanc { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.form-stack { display: flex; flex-direction: column; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.adder { position: relative; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.adder .search { position: relative; }

.cands button:hover, .cands button.sel { background: var(--accent-soft); padding-left: 14px; }
.cands .sub { margin-left: auto; color: var(--text-3); font-size: 13px; text-align: right; }
.itens li { gap: 12px; }
.itens .qty { width: 84px; text-align: right; }

.lanc-foot .sum, .frente .sum { color: var(--text-2); font-size: 14px; }
.lanc-foot .btn.primary { margin-left: auto; min-height: 46px; padding: 0 24px; font-size: 16px; }

/* papel envelhecido (folha do lançamento e modal do protocolo registrado) */
.papel {

/* entrada de página (só ao trocar de aba) */

@keyframes fade { from { opacity: 0; } }

@keyframes drawer-out { to { opacity: 0; translate: 50px 0; } }
@keyframes toast-in { from { opacity: 0; translate: 48px 0; rotate: 2.5deg; } }
@keyframes toast-out { to { opacity: 0; translate: 32px 0; scale: .96; } }
@keyframes papel-pousa { from { opacity: 0; translate: 0 -34vh; rotate: -5deg; scale: 1.03; } 50% { opacity: 1; } 78% { rotate: .5deg; } }

  0% { opacity: 0; translate: 36px -170px; rotate: 9deg; scale: 1.28; animation-timing-function: cubic-bezier(.55, 0, .9, .4); }
  12% { opacity: 1; }
  35% { translate: 0 0; rotate: 0deg; scale: 1; animation-timing-function: ease-out; }
  43% { scale: 1.035 .93; }
  54% { opacity: 1; translate: 0 -5px; scale: 1; animation-timing-function: cubic-bezier(.5, 0, .75, 0); }

}

@keyframes thud { 30% { scale: .985; } 60% { scale: 1.006; } }
@keyframes shake { 20%, 60% { translate: -4px 0; } 40%, 80% { translate: 4px 0; } }

const IDB_NAME = 'almoxarifado-ti', IDB_STORE = 'kv';
let idbHandle = null;
function idb() {
  if (idbHandle) return Promise.resolve(idbHandle);
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => { idbHandle = r.result; res(idbHandle); };
    r.onerror = () => rej(r.error);
  });
}
async function loadDb() {
  let r = null;
  try {
    const d = await idb();
    r = await new Promise((res, rej) => {
      const q = d.transaction(IDB_STORE).objectStore(IDB_STORE).get('db');
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  } catch {
    try { r = JSON.parse(localStorage.getItem('almoxarifado-ti') || 'null'); } catch {}
  }
  return docModelosGarantir(r);
}
async function persist() {
  try {
    const d = await idb();
    await new Promise((res, rej) => {
      const t = d.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(db, 'db');
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch {
    try { localStorage.setItem('almoxarifado-ti', JSON.stringify(db)); }
    catch { toast('Não foi possível salvar os dados neste navegador. Faça um backup agora.', true); }
  }
}
function commit() { persist(); renderNav(); }
async function idbReq(mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => {
    const q = fn(d.transaction(IDB_STORE, mode).objectStore(IDB_STORE));
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}

function buildInitialDb() {
  const raw = JSON.parse(document.getElementById('seed').textContent);
  const db = emptyDb();
  db.unidades = SEED_UNITS.map(([nome, setores]) => ({ nome, setores: [...setores] }));
  db.categorias = [...SEED_CATS];
  db.produtos = [
    ...SEED_ITENS.map(([nome, modelo, un, min]) => ({ id: uid(), tipo: 'item', nome, modelo, cor: '', un, min, qtd: 0 })),
    ...SEED_TONERS.map(([nome, modelo, cor, min]) => ({ id: uid(), tipo: 'toner', nome, modelo, cor, un: 'Unidade', min, qtd: 0 })),
  ];
  const setorDe = (un, s) => {
    if (!s || s === '-') return '';
    const u = db.unidades.find(x => x.nome === un);
    if (norm(s) === norm(un)) return '';
    const hit = u && u.setores.find(x => norm(x) === norm(s));
    if (hit) return hit;

    if (u) u.setores.push(nome);

    const p = { id: 'P' + (++n), cat: r.cat, marca: fixMarca(r.marca), modelo: r.cat === 'Impressora' ? fixModelo(r.modelo) : (r.modelo || ''), posse: r.cat === 'Impressora' ? (r.tipo || '') : '', num: '', sp: false, locadora: '', un: r.un || '', setor: r.setor || '', status, obs: '', conferir: '' };

    else if (PAT_RE.test(s)) p.num = s;

      p.sp = true;
      const m = s.match(/^(.*?)\s*s\.?\s*p\.?$/i);
      if (m && m[1] && !p.marca) p.marca = fixMarca(m[1]);
      if (s && !/s\.?\s*p|sem|^-$/i.test(s)) { notes.push(`Nº na planilha fora do padrão: ${s}`); p.conferir = 'Número de patrimônio fora do padrão (5 ou 6 dígitos).'; }
    }
    if (p.cat === 'Impressora' && !p.posse && status === 'ativo') p.conferir = 'Informe se a impressora é própria ou locada.';
    const ref = (r.proto || '').trim();
    if (ref && ref !== '-' && !/^\d+$/.test(ref)) notes.push(`Ref.: ${ref}`);
    if (r.obs && r.obs !== '-') notes.push(r.obs);
    if (r.detalhes) notes.push(r.detalhes);
    p.obs = notes.join(' · ');
    p._proto = /^\d+$/.test(ref) ? +ref : -1;
    return p;
  };

  const ativos = raw.items.map(r => {
    const un = r.unidade;
    if (!db.unidades.some(u => u.nome === un)) db.unidades.push({ nome: un, setores: [] });
    return mkPat({ ...r, cat: r.produto, un, setor: setorDe(un, r.setor) }, 'ativo');
  });
  const DESC_CAT = { 'gabinete pc': 'CPU', 'ponto eletronico': 'Relógio de ponto' };
  const descartados = raw.descarte.map(d => mkPat({ cat: DESC_CAT[norm(d.produto)] || titleCase(d.produto), pat: d.pat, detalhes: d.detalhes, proto: '' }, 'descartado'));

  const keep = new Map();

    if (!p.num) continue;
    const prev = keep.get(p.num);
    if (!prev) { keep.set(p.num, p); continue; }
    const [win, lose] = p._proto > prev._proto ? [p, prev] : [prev, p];

}

function folhaRig(dr, pai) {

const FOLHA_SAI = {
  dobra(dr, out) {
    const f = folhaRig(dr, out);

    const fecha = (el, delay) => el.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-180deg)' }], { delay, duration: 280, easing: DOBRA, fill: 'both' });
    const sombra = (el, delay, ate = .7) => el.animate([{ opacity: 0 }, { opacity: ate }], { delay, duration: 280, easing: 'ease-in', fill: 'both' });
    fecha(f.h3, 0); sombra(f.v[2], 0); fecha(f.h2, 190); sombra(f.v[1], 190); sombra(f.v[0], 190, .45);
    return f.rig.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(70px) rotate(2deg)' }], { delay: 420, duration: 200, easing: 'cubic-bezier(.7, 0, .84, 0)', fill: 'both' }).finished;
  },

      .concat([[0, 0], [w, 0], [w, h], [0, h]].map(([x, y]) => Math.atan2(y - cy, x - cx))).sort((a, b) => a - b);
    const borda = a => { const dx = Math.cos(a), dy = Math.sin(a); const k = Math.min(dx > 0 ? (w - cx) / dx : dx < 0 ? -cx / dx : 1e9, dy > 0 ? (h - cy) / dy : dy < 0 ? -cy / dy : 1e9); return [cx + dx * k, cy + dy * k]; };
    const A = angs.map(borda), B = angs.map((a, i) => { const r = R * (i % 2 ? .88 : 1) * (.9 + Math.random() * .16); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
    const M = A.map(([x, y], i) => { const k = .5 + Math.random() * .2; return [x + (B[i][0] - x) * k + (Math.random() - .5) * 36, y + (B[i][1] - y) * k + (Math.random() - .5) * 36]; });

/* ---------- TONERS ---------- */
function viewToners() {
  const toners = db.produtos.filter(p => p.tipo === 'toner').sort((a, b) => prodLabel(a).localeCompare(prodLabel(b), 'pt'));
  const meses = [];
  { const d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); meses.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`); } }
  const tonerIds = new Set(toners.map(t => t.id));
  const cons = {}, porToner = {};
  const d30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  for (const pr of db.protocolos) {
    if (pr.tipo !== 'saida') continue;
    for (const it of pr.itens) {
      if (it.k !== 'p' || !tonerIds.has(it.id)) continue;
      const ym = pr.data.slice(0, 7);
      if (meses.includes(ym)) { cons[pr.un] ||= {}; cons[pr.un][ym] = (cons[pr.un][ym] || 0) + it.qtd; }
      if (pr.data >= d30) porToner[it.id] = (porToner[it.id] || 0) + it.qtd;
    }
  }
  const unRows = Object.entries(cons).map(([u, m]) => [u, m, meses.reduce((s, k) => s + (m[k] || 0), 0)]).sort((a, b) => b[2] - a[2]);
  return pageHead('Toners', 'Estoque por modelo e cor, com consumo por unidade.',
    `<button class="btn" data-act="prod-new" data-tipo="toner">${icon('plus')}Novo toner</button><a class="btn" href="#/lancar?tipo=entrada">${icon('in')}Entrada</a><a class="btn primary" href="#/lancar?tipo=saida">${icon('out')}Saída de toner</a>`) +
    `<div class="toner-grid" style="margin-bottom:16px">${toners.map(t => {
      const st = stockState(t), pct = t.min ? Math.min(100, t.qtd / (t.min * 2) * 100) : (t.qtd ? 100 : 0);
      return `<article class="card toner"><div class="top">${t.cor ? `<span class="dot" style="background:${TONER_CORES[t.cor] || '#999'}"></span>` : `<span class="dot" style="background:repeating-linear-gradient(45deg,#94A3B8 0 2px,#E2E8F0 2px 4px)"></span>`}<b>${esc(t.nome + ' ' + t.modelo)}${t.cor ? `<br><span style="font-weight:500;color:var(--text-2)">${esc(t.cor)}</span>` : ''}</b><button class="btn icon sm ghost" style="margin-left:auto" data-act="prod-open" data-id="${t.id}" aria-label="Editar ${esc(prodLabel(t))}">${icon('edit')}</button></div>
        <div class="qty"><b>${t.qtd}</b><span>em estoque · mín. ${t.min}</span></div>
        <div class="meter ${st}" role="img" aria-label="${STOCK_BADGE[st][1]}"><i style="width:${pct}%"></i></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3)">${stockBadge(t)}<span>${porToner[t.id] || 0} saídas em 30 dias</span></div>
        <div class="acts"><a class="btn sm" href="#/lancar?tipo=entrada&p=${t.id}">${icon('in')}Entrada</a><a class="btn sm" href="#/lancar?tipo=saida&p=${t.id}">${icon('out')}Saída</a></div>
      </article>`;
    }).join('')}</div>
    <section class="card"><header><h2>Consumo por unidade (saídas, últimos 6 meses)</h2></header>
      ${unRows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Unidade</th>${meses.map(m => `<th class="n">${fmtMes(m)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
        ${unRows.map(([u, m, tot]) => `<tr><td>${esc(u)}</td>${meses.map(k => `<td class="n ${m[k] ? '' : 'muted'}">${m[k] || '—'}</td>`).join('')}<td class="n"><b>${tot}</b></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty"><b>Sem saídas de toner nos últimos 6 meses</b>Registre uma saída para começar o histórico de consumo.</div>`}
    </section>`;
}

function patFiltered(aba, ignoreUn = false) {

    if (r.tipo === 'transferencia') { e('Transferência só move patrimônios; itens de estoque vão por saída.'); continue; }
    const p = ms[0], qtd = s.qtd ?? 1;
    if (qtd < 1) { e(`Quantidade inválida para ${prodLabel(p)}.`); continue; }
    r.itens.push({ k: 'p', id: p.id, qtd });
    r.partes.push(`<b>${qtd}×</b> ${esc(prodLabel(p))} <span class="sub">Em estoque: ${p.qtd}</span>`);
  }

  if (r.tipo === 'entrada') {
    if (de) { r.un = de.un; r.setor = de.setor; }
    else if (!origemKw || origemKw === ORIGENS[1]) {
      const uns = [...new Set(exist.map(p => p.un))], ss = [...new Set(exist.map(p => p.setor))];
      if (uns.length === 1) { r.un = uns[0]; r.setor = ss.length === 1 ? ss[0] : ''; }
    }
    r.origem = origemKw || (r.un || exist.length ? ORIGENS[1] : ORIGENS[0]);
    if (r.origem !== ORIGENS[1]) { r.un = ''; r.setor = ''; }
  }
  if (r.tipo === 'descarte') r.pessoa = '';
  const rota = r.tipo === 'entrada' ? `${r.un ? loc(r.un, r.setor) : r.origem} → ${ESTOQUE}` : r.tipo === 'saida' ? `${ESTOQUE} → ${loc(r.un, r.setor)}` : r.tipo === 'transferencia' ? `Para ${loc(r.un, r.setor)}` : 'Baixa do inventário';
  r.head = `${tipoBadge(r.tipo)}<span>${esc(rota)}</span><span>${fmtD(r.data)}</span>${r.pessoa ? `<span>${r.tipo === 'entrada' ? 'Entregue' : 'Recebido'} por ${esc(r.pessoa)}</span>` : ''}${r.obs ? `<span>${r.tipo === 'descarte' ? 'Motivo' : 'Obs.'}: ${esc(r.obs)}</span>` : ''}`;
  r.key = [r.tipo, r.data, r.un, r.setor, r.origem, r.pessoa, r.obs].join('|');
  return r;
}
// interpreta e grava linha a linha no db atual; linhas seguidas com a mesma chave viram um protocolo
function txtProcessar(texto) {
  const locs = txtLocais(), linhas = [], prs = [];
  let g = null;
  const fechar = () => {
    if (g && g.d.itens.length) {
      const m = validarDraft(g.d);
      if (m) g.linhas[g.linhas.length - 1].erros.push(m);
      else { const pr = gravarDraft(g.d); prs.push(pr); g.linhas.forEach(l => { l.proto = pr.num; }); }
    }
    g = null;
  };
  texto.split('\n').forEach((src, i) => {
    if (!src.trim()) return fechar();
    let l = txtLinha(src, locs);
    if (g && (l.erros.length || l.key !== g.key)) { fechar(); l = txtLinha(src, locs); }
    l.n = i + 1; l.src = src; linhas.push(l);
    if (l.erros.length) return;
    if (!g) g = { key: l.key, linhas: [], d: { tipo: l.tipo, data: l.data, un: l.un, setor: l.setor, pessoa: l.pessoa, origem: l.origem || ORIGENS[0], obs: l.obs, itens: [] } };
    for (const it of l.itens) {
      if (it.k === 'p') {
        const ex = g.d.itens.find(x => x.k === 'p' && x.id === it.id), p = prodById(it.id), tot = it.qtd + (ex ? ex.qtd : 0);
        if ((l.tipo === 'saida' || l.tipo === 'descarte') && tot > p.qtd) { l.erros.push(`${prodLabel(p)}: estoque insuficiente (tem ${p.qtd}${ex ? `, ${ex.qtd} já pedido(s) acima` : ''}).`); continue; }
        if (ex) ex.qtd = tot; else g.d.itens.push({ ...it });
      } else if (g.d.itens.some(x => it.k === 'b' ? x.id === it.id : x.k === 'n' && x.pat.num === it.pat.num)) l.erros.push(`${it.k === 'b' ? patIdent(patById(it.id)) : it.pat.num} aparece duas vezes.`);
      else g.d.itens.push({ ...it });
    }
    if (!l.erros.length) g.linhas.push(l);
  });
  fechar();
  return { linhas, prs };
}

  try { return fn(); } finally { db = real; }
}

function undoProto(id) {
  const pr = db.protocolos.find(p => p.id === id);
  confirmDialog(`Desfazer protocolo Nº ${pr.num}?`, 'O estoque e os locais dos patrimônios voltam ao que eram antes. Patrimônios cadastrados neste protocolo serão removidos.', 'Desfazer', () => {
    for (const it of pr.itens) {
      if (it.k === 'p') { const p = prodById(it.id); if (p) p.qtd -= pr.tipo === 'entrada' ? it.qtd : -it.qtd; continue; }
      if (it.novo) { db.pats = db.pats.filter(p => p.id !== it.id); continue; }
      const p = patById(it.id); if (p) Object.assign(p, it.de);
    }
    db.protocolos = db.protocolos.filter(p => p.id !== id);
    if (db.config.protoNext === pr.num + 1) db.config.protoNext = pr.num;
    commit(); closeLayer(); render(); toast(`Protocolo Nº ${pr.num} desfeito.`);
  }, true);
}

    ui.docGer = false;

  if (ui.doc && !docModelo(ui.doc)) { ui.doc = null; docGuarda(); toast('O modelo que estava em uso foi removido.', true); }
  const m = id && docModelos().find(x => x.id === id);
  if (id && !m) { history.replaceState(null, '', '#/documentos'); toast('Modelo não encontrado.', true); }
  if (!m) return docCatalogo();

}

/* ---------- documentos guardados (db.docsFeitos: valores + cópia do modelo e dos bens citados) ---------- */
function docRegistra(d, m) {

  const r = { id: velho ? velho.id : uid(), criado: velho ? velho.criado : new Date().toISOString(), modelo: m.id, num: docNumeros(d, m).join(' e '),

    pats: docPats(db, d.v, m).map(({ fotos, ...p }) => docCopia(p)), ...(d.de ? { de: d.de } : {}) };

const docReg = id => db.docsFeitos.find(r => r.id === id);
// Os bens citados saem como estavam ao gerar (a cópia tem prioridade sobre o cadastro atual).
function docComPats(r, fn) {
  const real = db; db = { ...real, pats: [...(r.pats || []), ...real.pats] };

}
const docFolhaReg = r => docComPats(r, () => docFolha({ id: r.modelo, v: r.v, manual: {} }, r.m));

function docRegResumo(r) {
  const cs = r.m.campos, val = f => String(r.v[f.id] ?? '').trim();
  const local = cs.filter(f => f.tipo === 'unidade' || f.tipo === 'setor').map(val).filter(Boolean).join(' · ');
  return [local, val(cs.find(f => f.id === 'nome') || {})].filter(Boolean).join(' · ');

function docRegBusca(r) {

  return norm([r.num, r.m.titulo, fmtD(r.criado.slice(0, 10)), r.criado.slice(0, 10), ...vals, ...(r.pats || []).map(p => `${p.num} ${p.locadora || ''} ${p.cat} ${p.marca} ${p.modelo}`)].join(' '));

function docBibIndice() {

// Ponto de partida: valores do antigo no modelo atual; nº e demais automáticos não editados voltam a ser gerados.
function docDuplica(r) {

  for (let i = 0; i < 2; i++) m.campos.forEach(f => { if (f.auto && !d.manual[f.id]) d.v[f.id] = docAuto(f, d.v, m); });

// medidas do caderno sem transformação; a origem das poses é o centro do caderno fechado (a capa)
function cadMede(cad) {
  const r = cad.getBoundingClientRect(), capa = $('.cad-capa', cad);
  const g = { L: r.left, T: r.top, bw: capa.offsetWidth, bh: capa.offsetHeight, ox: capa.offsetLeft + capa.offsetWidth / 2, oy: capa.offsetTop + capa.offsetHeight / 2, largo: capa.offsetLeft > 0 };
  cad.style.transformOrigin = `${g.ox}px ${g.oy}px`;

const cadPose = (g, x, y, k = 1, r = 0) => tf(x - g.L - g.ox, y - g.T - g.oy, k, r);
// boca da gaveta (borda de cima da frente aberta) e o caderno pequeno lá dentro: centro x, escala, altura, centro dentro e fora
function gavGeo(arm, gav, g) {
  const f = $('.gav-frente', gav).getBoundingClientRect(), fs = parseFloat(getComputedStyle(arm).fontSize), aberta = gav.classList.contains('aberta');
  const w = aberta ? f.width / 1.065 : f.width, boca = aberta ? f.top : f.top + .134 * fs, k = w * .6 / g.bw, h = g.bh * k;
  return { x: f.left + f.width / 2, boca, k, h, dentro: boca + h / 2 + 6, fora: boca - h / 2 };

// a gaveta de onde o caderno consegue sair inteiro sem passar do topo da tela (de preferência a clicada)
function gavEscolhe(arm, g, quer) {

/* ---------- busca global ---------- */
function globalResults(q) {
  const nq = norm(q), groups = [];
  if (!nq) return groups;
  const pats = db.pats.filter(p => hit(norm([p.num, p.locadora, p.cat, p.marca, p.modelo, p.un, p.setor].join(' ')), nq))
    .sort((a, b) => (b.num === q.trim()) - (a.num === q.trim()) || (a.status === 'ativo' ? -1 : 1)).slice(0, 8);
  if (pats.length) groups.push(['Patrimônios', pats.map(p => ({ act: 'pat-open', id: p.id, html: `${patIdentHtml(p)} ${esc(patDesc(p))}`, sub: (p.status === 'descartado' ? 'Descartado · ' : '') + esc(loc(p.un, p.setor)) }))]);
  const prods = db.produtos.filter(p => hit(norm(prodLabel(p) + ' ' + p.tipo), nq)).slice(0, 6);
  if (prods.length) groups.push(['Itens e toners', prods.map(p => ({ act: 'prod-open', id: p.id, html: esc(prodLabel(p)), sub: `Estoque ${p.qtd}` }))]);
  const units = db.unidades.filter(u => hit(norm(u.nome), nq) || u.setores.some(s => hit(norm(s), nq))).slice(0, 5);
  if (units.length) groups.push(['Unidades', units.map(u => ({ href: `#/patrimonios?un=${encodeURIComponent(u.nome)}`, html: esc(u.nome), sub: plural(db.pats.filter(p => p.un === u.nome && p.status === 'ativo').length, 'patrimônio') }))]);
  const protos = db.protocolos.filter(pr => String(pr.num) === q.trim() || hit(norm(pr.pessoa), nq)).slice(0, 5);
  if (protos.length) groups.push(['Protocolos', protos.map(pr => ({ href: `#/movimentacoes?p=${pr.num}`, html: `Nº ${pr.num} · ${esc(TIPOS[pr.tipo].label)}`, sub: `${fmtD(pr.data)} · ${esc(protoDest(pr))}` }))]);
  return groups;
}
function showGlobal() {
  const q = $('#gq').value, box = $('#gresults');
  const groups = globalResults(q);
  if (!q.trim()) { box.hidden = true; return; }
  box.hidden = false;
  if (!groups.length) { box.innerHTML = `<div class="empty" style="padding:16px">Nada encontrado para "${esc(q)}".</div>`; return; }
  let i = 0;
  box.innerHTML = groups.map(([g, items]) => `<h6>${g}</h6>` + items.map(it => `<button class="${i++ === 0 ? 'sel' : ''}" ${it.act ? `data-act="${it.act}" data-id="${it.id}"` : `data-act="go" data-href="${it.href}"`}><span>${it.html}</span><span class="sub">${it.sub}</span></button>`).join('')).join('');
}

    const ano = today().slice(0, 4), v = Object.keys(DOC_SERIES).map(s => [s, parseInt($('#cfg-doc-' + s).value, 10)]);
    if (v.some(([, n]) => !(n >= 1))) return toast('Use números a partir de 1.', true);
    v.forEach(([s, n]) => { (db.config.docNum ||= {})[`${s}-${ano}`] = n; }); commit(); toast('Numeração dos documentos salva.');
  },
  'proto-save': () => { const v = parseInt($('#cfg-proto').value, 10); const max = db.protocolos.reduce((m, p) => Math.max(m, p.num), 0); if (!(v > max)) return toast(`O número precisa ser maior que ${max}.`, true); db.config.protoNext = v; commit(); toast('Numeração salva.'); },
};
function rerenderBehind() { const y = window.scrollY; const layer = $('#layer').innerHTML; renderNav(); $('#view').innerHTML = VIEWS[ui.route](); $('#layer').innerHTML = layer; window.scrollTo(0, y); }
const INPUTS = {
  itf: t => { ui.itf[t.dataset.k] = t.value; refreshItens(); },
  pf: t => { pf(ui.route)[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.k === 'un') pf(ui.route).setor = ''; t.tagName === 'SELECT' && t.dataset.k === 'un' ? render() : refreshPats(); },
  mf: t => { ui.mf[t.dataset.k] = t.value; $('#mtable').innerHTML = movTable(); },
  bf: t => { ui.bf[t.dataset.k] = t.value; $('#btable').innerHTML = docBibTabela(); },
  df: t => { ui.df.q = t.value; const pos = t.selectionStart; render(); const n = $('#dq'); n.focus(); n.setSelectionRange(pos, pos); },
  draft: t => {
    const k = t.dataset.k; ui.draft[k] = t.value;
    if (k === 'un') ui.draft.setor = '';
    if (k === 'origem' && t.value !== 'Devolução de unidade') { ui.draft.un = ''; ui.draft.setor = ''; }
    if (t.dataset.rerender || k === 'un') render();
  },
  qty: t => {
    const it = ui.draft.itens[+t.dataset.i]; it.qtd = parseInt(t.value, 10) || 0;
    const li = t.closest('li'), p = prodById(it.id), d = ui.draft;
    const over = (d.tipo === 'saida' || d.tipo === 'descarte') && it.qtd > p.qtd;
    t.classList.toggle('err', over);
    $('.sub', li).textContent = `Em estoque: ${p.qtd}${d.tipo === 'entrada' ? ` → ${p.qtd + it.qtd}` : ` → ${p.qtd - it.qtd}`}`;
    let em = $('.err-msg', li); if (over && !em) { em = document.createElement('span'); em.className = 'err-msg'; em.textContent = 'Quantidade maior que o estoque'; $('.grow', li).append(em); } else if (!over && em) em.remove();
    $('.maq .sum').textContent = draftSummary();
  },
  txt: t => {
    ui.txt = t.value;
    clearTimeout(ui.txtT);
    ui.txtT = setTimeout(() => { const el = $('#txt-prev'); if (!el) return; const pl = txtPlano(); el.innerHTML = txtPreview(pl); $('#txt-sum').innerHTML = txtSum(pl); $('#maq-bts').innerHTML = txtBotoes(pl); }, 150);
  },
  'pt-sp': t => { const n = $('#pt-num'); n.disabled = t.checked; if (t.checked) { n.value = ''; n.classList.remove('err'); } },
  'pt-un': t => { $('#pt-setor').innerHTML = setorOpts(t.value, ''); },
  'pt-posse': t => { const l = $('#lt-rows'); if (l) { l.classList.toggle('locada', t.value === 'Locada'); loteCheck(); } },
  'lt-qtd': t => { const n = parseInt(t.value, 10); if (n >= 1) loteQtd(Math.min(LOTE_MAX, n)); },
  'lt-num': () => loteCheck(),
  'pt-marca': t => $$('#lt-rows [data-lt=marca]').forEach(x => { x.placeholder = t.value.trim() || 'Marca'; }),
  'lt-sp': t => { const n = $('[data-lt=num]', t.closest('li')); n.disabled = t.checked; if (t.checked) n.value = ''; loteCheck(); },
  'lt-paste': lotePaste,
  restore: t => { if (t.files[0]) restoreFile(t.files[0]); t.value = ''; },
  doc: t => { docSet(ui.doc, t.dataset.id, t.value); docSync(ui.doc, t.dataset.id); },
  'doc-pat': docPatCands,
  ed: t => { ui.docEd.m[t.dataset.k] = t.value; docEdAtualiza(); },
  'ed-f': docEdCampoSet,
  'ed-corpo': t => { ui.docEd.m.corpo = t.value; clearTimeout(ui.edT); ui.edT = setTimeout(docEdAtualiza, 90); },
  'pat-foto': t => { if (t.files.length) patFotoAdd(t.files); t.value = ''; },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!e.target.closest('.gsearch')) $('#gresults').hidden = true;
  if (!e.target.closest('.doc-pat')) $$('.doc-pat .cands').forEach(b => { b.hidden = true; });
  if (!t) return;
  const link = e.target.closest('a[href]');
  if (link && link !== t && t.contains(link)) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { if (t.tagName !== 'A') e.preventDefault(); fn(t, e); }
});
document.addEventListener('input', e => { marcaSujo(e); const t = e.target.closest('[data-in]'); if (t) INPUTS[t.dataset.in](t, e); datilografa(e); rabisca(e); });
document.addEventListener('change', e => { marcaSujo(e); const t = e.target.closest('[data-ch]'); if (t) INPUTS[t.dataset.ch](t, e); datilografa(e); rabisca(e); });
document.addEventListener('paste', e => { marcaSujo(e); const t = e.target.closest('[data-paste]'); if (t) INPUTS[t.dataset.paste](t, e); });
document.addEventListener('dragover', e => {
  if (!temArquivo(e)) return;
  e.preventDefault();
  const dr = alvoFoto(e); e.dataTransfer.dropEffect = dr ? 'copy' : 'none'; marcaRecebe(dr);
});
document.addEventListener('drop', e => {
  if (!temArquivo(e)) return;
  e.preventDefault(); marcaRecebe(null);
  if (alvoFoto(e) && e.dataTransfer.files.length) patFotoAdd(e.dataTransfer.files, { x: e.clientX, y: e.clientY });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.lightbox')) { ACTIONS['foto-fechar'](); return; }
  if (e.key === 'Escape' && $('#layer').innerHTML) { layerFora(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.dataset && e.target.dataset.ctrlEnter) { e.preventDefault(); ACTIONS[e.target.dataset.ctrlEnter](e.target); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACTIONS[e.target.dataset.enter](e.target); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); $('#gq').focus(); $('#gq').select(); }
});
$('#gq').addEventListener('input', showGlobal);
$('#gq').addEventListener('focus', showGlobal);
$('#gq').addEventListener('keydown', e => {
  const btns = $$('#gresults button'); if (!btns.length) return;
  let i = btns.findIndex(b => b.classList.contains('sel'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, j) => b.classList.toggle('sel', j === i)); btns[i].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); btns[Math.max(0, i)].click(); }
  else if (e.key === 'Escape') { $('#gresults').hidden = true; }
});
window.addEventListener('hashchange', route);
document.addEventListener('click', hideCandsOutside);

/* ---------- texturas ---------- */
async function texturas() {
  const raiz = document.documentElement, cs = getComputedStyle(raiz), k = Math.min(2, Math.ceil(devicePixelRatio || 1));
  for (const v of ['--fibra', '--manchas', '--grain', '--ink-mask']) {
    try {
      const m = cs.getPropertyValue(v).match(/url\("(data:image\/svg\+xml[^"]+)"\)/);
      if (!m) continue;
      const img = new Image(); img.src = m[1]; await img.decode();
      const c = document.createElement('canvas'); c.width = img.naturalWidth * k; c.height = img.naturalHeight * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r));
      if (blob) raiz.style.setProperty(v, `url("${URL.createObjectURL(blob)}")`);
    } catch {}
  }
}

/* ---------- início ---------- */
(async function init() {
  texturas();
  try { if (localStorage.getItem('almox-lanc-modo') === 'texto') ui.lancModo = 'texto'; } catch {}
  try { ui.mudo = localStorage.getItem('almox-som') === '0'; } catch {}
  if (matchMedia('(max-width: 520px)').matches) $('#gq').placeholder = 'Buscar em tudo';
  $('.menu-btn').innerHTML = icon('menu');
  $$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon); });
  $('.gsearch').insertAdjacentHTML('afterbegin', icon('search'));
  db = await loadDb();
  if (!db) { db = buildInitialDb(); await persist(); }
  fotosGc();
  docRecupera();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  route();
  (window.requestIdleCallback || setTimeout)(() => somPronto(), { timeout: 3000 });
})();
